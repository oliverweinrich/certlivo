name: Publish release
on:
  push:
    tags:
      - v*
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: certlivo-publish
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check formatting and development dependencies
        run: |-
          npm ci --ignore-scripts --no-audit
          node scripts/ci.ts validate
      - name: Validate release ref
        run: node scripts/ci.ts release-ref
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            { "features": { "containerd-snapshotter": true } }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - name: Restore source downloads
        id: source-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            release-cache/recipes
            release-cache/distfiles
            release-cache/node
          key: release-sources-v1-${{ runner.os }}-${{ hashFiles('image/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-sources-v1-${{ runner.os }}-${{ hashFiles('image/Dockerfile') }}-
            release-sources-v1-${{ runner.os }}-
      - name: Prepare matching sources and licenses with fresh packages
        id: prepare_sources
        run: npm run release:prepare
      - name: Save source downloads
        if: ${{ !cancelled() && (steps.prepare_sources.outcome == 'success' || steps.prepare_sources.outcome == 'failure') }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            release-cache/recipes
            release-cache/distfiles
            release-cache/node
          key: ${{ steps.source-cache.outputs.cache-primary-key }}
      - name: Scan source collection dependencies
        run: node scripts/scan.ts certlivo-source-helper:local
        env:
          CERTLIVO_SCAN_REPORT: ${{ github.workspace }}/reports/trivy-source-helper.json
      - name: Build the final multi-platform image
        run: node scripts/ci.ts build-candidate
      - name: Scan the tested image for both platforms
        run: node scripts/ci.ts scan-candidate
      - name: Generate architecture SBOMs
        run: node scripts/ci.ts candidate-sbom
      - name: Checksum SBOMs and verify complete candidate
        run: node scripts/ci.ts finish-candidate
      - name: Save release files for diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            release-output/*/certlivo-*-sources.tar.gz
            release-output/*/certlivo-*-licenses.tar.gz
            release-output/*/packages.tsv
            release-output/*/npm-packages.json
            release-output/*/node-version
            release-output/*/SHA256SUMS
            release-output/*/trivy-*.json
            release-output/*/sbom-*.spdx.json
            reports/trivy-source-helper.json
          if-no-files-found: warn
          retention-days: 7
      - name: Export the exact release candidate
        run: node scripts/ci.ts export-candidate
      - name: Transfer candidate image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: |
            candidate/image.tar
            candidate/image.tar.sha256
          compression-level: 0
          retention-days: 7
      - name: Transfer matching release state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-state
          path: candidate/release-state.tar.gz
          compression-level: 0
          retention-days: 7
  test:
    name: Test release (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install test tooling
        run: npm ci --ignore-scripts --no-audit
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            { "features": { "containerd-snapshotter": true } }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image
          path: candidate
      - name: Load and test the candidate on native hardware
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |-
          node scripts/ci.ts load-candidate
          npm run test:integration
  release:
    name: Publish tested release
    needs:
      - prepare
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dockerhub
    permissions:
      contents: write
    env:
      CERTLIVO_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'oliverweinrich/certlivo' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            { "features": { "containerd-snapshotter": true } }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-state
          path: candidate
      - name: Validate unused version before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release/publish.ts --check
      - name: Restore the tested image and matching sources
        run: node scripts/ci.ts restore-release
      - name: Validate overview credentials before image publication
        env:
          DOCKERHUB_OVERVIEW_TOKEN: ${{ secrets.DOCKERHUB_OVERVIEW_TOKEN }}
        run: node scripts/ci.ts check-overview-token
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: node scripts/ci.ts docker-login
      - name: Publish sources, GitHub release and tested Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release/publish.ts
      - name: Update and verify Docker Hub overview
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_OVERVIEW_TOKEN }}
        run: node .github/dockerhub.ts --output reports/dockerhub-overview.md --publish
      - name: Save generated Docker Hub overview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dockerhub-overview
          path: reports/dockerhub-overview.md
          if-no-files-found: warn
          retention-days: 7
      - name: Log out of Docker Hub
        if: always()
        run: docker logout
